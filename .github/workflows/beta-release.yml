name: Auto Prerelease on Beta Tag

on:
  push:
    tags:
      - "v*-beta-*"

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release zip
        run: |
          cd custom_components/ev_smart_charging
          zip ev_smart_charging.zip -r ./

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: custom_components/ev_smart_charging/ev_smart_charging.zip
